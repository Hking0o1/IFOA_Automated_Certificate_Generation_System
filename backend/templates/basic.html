<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; border: 8px solid #1f3c88; padding: 40px; }
      h1 { text-align: center; color: #1f3c88; }
      .line { margin: 16px 0; font-size: 18px; }
      .footer { margin-top: 48px; display: flex; justify-content: space-between; }
    </style>
  </head>
  <body>
    <h1>Training Completion Certificate</h1>
    <p class="line">This is to certify that <strong>{{participant_name}}</strong></p>
    <p class="line">from <strong>{{company}}</strong> - <strong>{{department}}</strong></p>
    <p class="line">has successfully completed <strong>{{training_type}}</strong> training.</p>
    <p class="line">Training date: <strong>{{training_date}}</strong></p>
    <p class="line">Certificate valid until: <strong>{{validity_date}}</strong></p>
    <div class="footer">
      <span>IFOA Training Center</span>
      <span>Authorized Signature</span>
    </div>
  </body>
</html>
