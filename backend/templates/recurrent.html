<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Georgia, serif; margin: 40px; border: 8px double #113f67; padding: 40px; }
      h1 { text-align: center; color: #113f67; }
      .line { margin: 14px 0; font-size: 18px; }
      .modules { margin-top: 20px; background: #f3f7fb; border: 1px solid #d0deef; padding: 16px; }
    </style>
  </head>
  <body>
    <h1>Recurrent Training Certificate</h1>
    <p class="line">Participant: <strong>{{participant_name}}</strong></p>
    <p class="line">Company: <strong>{{company}}</strong></p>
    <p class="line">Department: <strong>{{department}}</strong></p>
    <p class="line">Training completed on: <strong>{{training_date}}</strong></p>
    <p class="line">Valid until: <strong>{{validity_date}}</strong></p>
    <div class="modules">
      <strong>Completed Modules:</strong>
      <p>{{modules}}</p>
    </div>
  </body>
</html>
